[workspace]
resolver = "2"
members = [
    "crates/simoder-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
sha2 = "0.10"
hex = "0.4"
png = "0.18"
base64 = "0.23"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[profile.release]
strip = true
lto = true
